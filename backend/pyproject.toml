[project]
name = "village-of-shadows-backend"
version = "0.1.0"
description = "Village of Shadows game orchestrator: FastAPI + LangGraph + MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.140.1",
    "langchain-anthropic>=1.5.2",
    "langchain-core>=1.5.1",
    "langchain-google-genai>=4.3.1",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "mcp>=1.28.1",
    "pydantic-settings>=2.14.2",
    "sse-starlette>=3.4.6",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
